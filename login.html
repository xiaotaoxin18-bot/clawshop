<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖店登录</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
  .container { text-align: center; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 2px 20px rgba(0,0,0,0.1); max-width: 420px; width: 90%; }
  h2 { margin-top: 0; }
  .qr-box { border: 2px dashed #ddd; border-radius: 12px; padding: 12px; margin: 20px auto; display: inline-block; }
  .qr-box img { width: 280px; height: 280px; display: block; }
  .btn { padding: 10px 24px; border-radius: 8px; border: none; font-size: 15px; cursor: pointer; }
  .btn-primary { background: #1677ff; color: white; }
  .btn-primary:hover { background: #4096ff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-text { margin: 12px 0; font-size: 14px; color: #666; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #ddd; border-top-color: #1677ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success { color: #52c41a; font-weight: 600; font-size: 16px; }
  .error { color: #ff4d4f; }
  .hint { font-size: 13px; color: #999; margin-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <h2>🔐 登录抖店</h2>
  <div id="status-area">
    <p class="status-text">点击下方按钮开始登录流程</p>
    <button class="btn btn-primary" onclick="startLogin()">开始登录</button>
  </div>
</div>
<script>
let pollTimer = null;

async function startLogin() {
  document.getElementById('status-area').innerHTML = '<p class="status-text"><span class="spinner"></span>正在启动浏览器...</p>';

  try {
    const res = await fetch('/api/douyin/scrape/login', { method: 'POST' });
    const data = await res.json();
    if (!data.success) {
      document.getElementById('status-area').innerHTML = '<p class="status-text error">启动失败：' + data.message + '</p><button class="btn btn-primary" onclick="startLogin()">重试</button>';
      return;
    }
    // 开始轮询
    pollTimer = setInterval(pollLoginStatus, 2000);
  } catch (e) {
    document.getElementById('status-area').innerHTML = '<p class="status-text error">请求失败，请重试</p><button class="btn btn-primary" onclick="startLogin()">重试</button>';
  }
}

async function pollLoginStatus() {
  try {
    const res = await fetch('/api/douyin/scrape/login-status');
    const data = await res.json();

    if (data.status === 'ready' && data.qr) {
      document.getElementById('status-area').innerHTML =
        '<div class="qr-box"><img src="' + data.qr + '" alt="二维码"/></div>' +
        '<p class="status-text"><span class="spinner"></span>请使用 <strong>抖店 App</strong> 扫码登录</p>' +
        '<p class="hint">扫码后页面会自动关闭</p>';
    } else if (data.status === 'done') {
      clearInterval(pollTimer);
      document.getElementById('status-area').innerHTML =
        '<p class="success">✅ 登录成功！Cookie 已保存</p>' +
        '<p class="hint">你可以关闭此页面了</p>';
    } else if (data.status === 'idle') {
      clearInterval(pollTimer);
      document.getElementById('status-area').innerHTML =
        '<p class="status-text error">登录进程已退出</p><button class="btn btn-primary" onclick="startLogin()">重新登录</button>';
    }
    // 'waiting_qr' - 继续等待
  } catch (e) {
    // 忽略轮询错误
  }
}
</script>
</body>
</html>
