<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖店登录 - Cookie 上传</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
  .container { text-align: center; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 2px 20px rgba(0,0,0,0.1); max-width: 460px; width: 90%; }
  h2 { margin-top: 0; }
  .btn { padding: 12px 28px; border-radius: 8px; border: none; font-size: 15px; cursor: pointer; display: inline-block; text-decoration: none; margin: 4px; }
  .btn-primary { background: #1677ff; color: #fff; }
  .btn-primary:hover { background: #4096ff; }
  .btn-success { background: #52c41a; color: #fff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  textarea { width: 100%; height: 160px; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 12px; font-family: monospace; box-sizing: border-box; margin: 10px 0; resize: vertical; }
  .step { text-align: left; margin: 20px 0; list-style: none; padding: 0; }
  .step li { padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; display: flex; align-items: flex-start; gap: 10px; }
  .step li:last-child { border-bottom: none; }
  .num { display: inline-flex; width: 26px; height: 26px; background: #1677ff; color: #fff; border-radius: 50%; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
  .status { margin: 12px 0; font-size: 14px; padding: 12px; border-radius: 8px; }
  .success { background: #f6ffed; color: #52c41a; }
  .error { background: #fff2f0; color: #ff4d4f; }
</style>
</head>
<body>
<div class="container">
  <h2>🔐 抖店 Cookie</h2>

  <ol class="step">
    <li><span class="num">1</span><span><a href="https://fxg.jinritemai.com/login/common?extra=%7B%22target_url%22%3A%22https%3A%2F%2Ffxg.jinritemai.com%2Fffa%2Fg%2Flist%3Fstatus%3D2%22%7D" target="_blank"><b>打开抖店</b></a> → 扫码登录</span></li>
    <li><span class="num">2</span><span>登录后按 <b>F12</b> → <b>Application</b> → <b>Cookies</b> → <code>fxg.jinritemai.com</code> → <b>全选</b> → 右键 → <b>Copy as JSON</b></span></li>
    <li><span class="num">3</span><span>粘贴到下面 → 点上传 → 自动采集</span></li>
  </ol>

  <textarea id="cookieInput" placeholder="在此粘贴 Cookie JSON..."></textarea>
  <button class="btn btn-primary" onclick="uploadCookie()">上传 Cookie 并采集</button>
  <div id="status"></div>
</div>
<script>
async function uploadCookie() {
  const text = document.getElementById('cookieInput').value.trim();
  if (!text) { document.getElementById('status').innerHTML = '<div class="status error">请先粘贴 Cookie</div>'; return; }
  document.getElementById('status').innerHTML = '<div class="status">上传中...</div>';
  try {
    const cookies = JSON.parse(text);
    const res = await fetch('/api/douyin/scrape/upload-cookie', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({cookies}) });
    const data = await res.json();
    if (data.success) {
      document.getElementById('status').innerHTML = '<div class="status success">✅ Cookie 已保存，正在采集...</div>';
      const r2 = await fetch('/api/douyin/scrape/trigger', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
      const d2 = await r2.json();
      document.getElementById('status').innerHTML += '<div class="status success">' + (d2.success ? '🚀 采集已启动！' : '❌ 采集启动失败') + '</div>';
    } else {
      document.getElementById('status').innerHTML = '<div class="status error">❌ ' + data.message + '</div>';
    }
  } catch(e) {
    document.getElementById('status').innerHTML = '<div class="status error">❌ JSON 格式错误</div>';
  }
}
</script>
</body>
</html>
